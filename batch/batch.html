<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批量转换为 Markdown</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <script src="../utils/theme.js"></script>
</head>
<body class="batch-body">
  <div class="batch-container">
    <header class="batch-header">
      <h1>批量转换</h1>
      <p class="muted">抓取选区内每个链接的页面并转为 Markdown，可分别下载或合并为一个文件。</p>
    </header>

    <!-- 步骤 1：链接列表 -->
    <section id="step-links" class="card">
      <div class="card-head">
        <h2>第 1 步：选择要转换的链接</h2>
        <div class="card-actions">
          <label class="check"><input type="checkbox" id="select-all" checked /> 全选</label>
          <button id="btn-refresh" class="link-btn" data-help="先回到原网页重新选中包含链接的内容，再点击此按钮读取其中的链接。重新读取会替换当前链接清单，请重新确认需要转换的条目。">重新读取选区</button>
          <button id="btn-pick" class="link-btn" data-help="切回原网页，移动鼠标并点击包含链接的区域，可连续点击多个区域。拾取的链接会去重追加到当前清单；完成后按 Esc 或右键，返回批量页确认条目。">框选区域拾取</button>
          <button id="btn-expand" class="link-btn" data-help="先勾选目录链接，再收集同域且严格位于该目录路径下的一层子链接，去重追加到当前清单，最多 100 个链接。不递归展开；展开后请确认勾选需要转换的条目，再开始转换。">展开已选目录</button>
        </div>
      </div>
      <div id="link-list" class="link-list"></div>
      <div id="picker-status" class="picker-status" hidden></div>
      <div id="empty-state" class="empty-state" hidden>
        <p id="empty-text"></p>
        <button id="btn-pick-empty" class="btn btn-accent" style="margin-top:10px">
          <span class="label">改用框选区域拾取链接</span>
        </button>
      </div>
    </section>

    <!-- 步骤 2：选项 -->
    <section id="step-options" class="card">
      <h2>第 2 步：输出方式</h2>
      <div class="options">
        <label class="radio" data-help="每个链接单独输出 Markdown；开启下载图片时，每篇输出包含 Markdown 和图片的 ZIP。"><input type="radio" name="mode" value="separate" checked /> <span><b>分别下载</b> - 每个链接一份文件</span></label>
        <label class="radio" data-help="把本批次成功转换的内容合并为一份 Markdown；开启下载图片时，输出一个包含合并内容和图片的 ZIP。"><input type="radio" name="mode" value="combined" /> <span><b>合并为一个文件</b> - 所有内容合并后下载</span></label>
      </div>
      <div class="options" style="margin-top:12px">
        <label class="check" data-help="在每篇转换结果前添加原网页标题和来源链接，方便追溯。此项用于当前批次。"><input type="checkbox" id="add-source" checked /> 每篇添加标题与来源链接</label>
        <label class="check" data-help="转换完成后自动触发下载。分别模式逐篇下载，合并模式下载合并结果；关闭时可在结果区手动下载。此项用于当前批次。"><input type="checkbox" id="auto-download" /> 完成后自动下载</label>
        <label class="check" data-help="开启后下载 ZIP，包含 Markdown 和成功获取的图片，链接改为本地相对路径。关闭后仅下载 Markdown，图片仍使用网络链接。获取失败的图片保留原网址。"><input type="checkbox" id="bundle-images" checked /> 下载图片并打包为 ZIP</label>
        <div class="setting-child">
          <label class="check" data-help="仅下载图片开启时生效。保留没有 alt（替代文字）和 title（标题）的图片，减少漏图，也可能包含图标和装饰。不包含 data: 内嵌图、CSS 背景图或正文提取已移除的图片。主开关关闭后会记住此选择，但暂不生效。"><input type="checkbox" id="keep-images" /> 包含图标／装饰图片</label>
        </div>
      </div>
      <button id="btn-start" class="btn btn-accent" style="margin-top:14px;width:100%">
        <span class="icon">▶</span><span class="label">开始批量转换</span>
      </button>
    </section>

    <!-- 步骤 3：进度 -->
    <section id="step-progress" class="card" hidden>
      <h2>第 3 步：转换进度</h2>
      <div class="progress-wrap">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-text" class="progress-text">0 / 0</span>
      </div>
      <div id="status-list" class="status-list"></div>
    </section>

    <!-- 步骤 4：结果 -->
    <section id="step-results" class="card" hidden>
      <div class="card-head">
        <h2>第 4 步：完成</h2>
        <div class="card-actions" id="result-actions"></div>
      </div>
      <div id="result-summary" class="result-summary"></div>
      <div id="combined-preview" class="combined-preview" hidden>
        <div class="tabs">
          <button class="tab active" data-tab="raw">Markdown 源码</button>
          <button class="tab" data-tab="rendered">渲染预览</button>
        </div>
        <pre id="combined-raw" class="combined-raw"></pre>
        <div id="combined-rendered" class="combined-rendered markdown-body" hidden></div>
      </div>
    </section>
  </div>

  <script src="../lib/marked.min.js"></script>
  <script src="../lib/jszip.min.js"></script>
  <script src="../utils/imageBundle.js"></script>
  <script src="../utils/linkExpansion.js"></script>
  <script src="../utils/batchItems.js"></script>
  <script src="../utils/imageSettings.js"></script>
  <script src="../utils/settingsHelp.js"></script>
  <script src="batch.js"></script>
</body>
</html>
