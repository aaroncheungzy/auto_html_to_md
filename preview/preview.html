<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 预览</title>
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body class="preview-body">
  <div class="preview-container">
    <header class="preview-header">
      <h1 id="title">Markdown 预览</h1>
      <div class="preview-actions">
        <button id="btn-copy" class="btn">📋 复制</button>
        <button id="btn-download" class="btn btn-primary">⬇ 下载</button>
      </div>
    </header>
    <div class="tabs">
      <button class="tab active" data-tab="raw">源码</button>
      <button class="tab" data-tab="rendered">渲染</button>
    </div>
    <div class="preview-body-wrap">
      <pre id="raw" class="preview-raw"></pre>
      <div id="rendered" class="preview-rendered markdown-body" hidden></div>
    </div>
  </div>
  <script src="../lib/marked.min.js"></script>
  <script src="../lib/jszip.min.js"></script>
  <script src="../utils/imageBundle.js"></script>
  <script src="preview.js"></script>
</body>
</html>
